# configs/experiments/E03_transfer_mobilenetv2.yaml
# Project: Ocean Plastic Waste Classification and Monitoring
# Task: S3-CNN (issue #17) | Owner: Hoàng Bách | Reviewer: Phan Hải Yến
# Branch: exp/s3-cnn-e03-transfer | Framework: PyTorch (torchvision)
#
# Baseline = best Sprint 2 model = E01 (CNN + class weights, NO augmentation), per S2-EVAL (#13).
# Remaining TODOs: copy from configs/experiments/E01_*.yaml (not in the S2-EVAL report).

exp_id: E03
name: transfer_mobilenetv2
description: >
  torchvision MobileNetV2 (ImageNet pretrained), 2-phase training, compared with
  E01 (custom CNN, class weights, no augmentation) on the same data, split and seed.
baseline_exp_id: E01           # runs/E01_20261105-1513
changed_factor: model          # custom CNN -> MobileNetV2 transfer learning
known_extra_differences:       # must be stated in the PR and experiment_log.md
  - framework TensorFlow/Keras -> PyTorch
  - input normalization required by the backbone (ImageNet mean/std)

baseline_reference:            # numbers E03 has to beat (Validation, S2-EVAL #13)
  macro_f1_val: 0.076
  accuracy_val: 0.219
  macro_f1_plastic6_val: 0.000
  best_val_loss: 2.977
  random_chance_macro_f1: 0.045

data:
  data_version: v1_crop128
  split_file: TODO             # same video-level split as E01 (ADR-001 D4); check the E01 config
  num_classes: 22
  train_samples: 8283
  val_samples: 1782
  use_test_set: false          # Test set must NOT be used (ADR-001 D7)
  num_workers: 2

seed: TODO                     # same seed as E01
reproducibility:
  torch_manual_seed: true
  cudnn_deterministic: true
  cudnn_benchmark: false
  worker_seed_fn: true

input:
  image_size: [128, 128]       # same crop size as E01 (v1_crop128); changing to 224 would be a 2nd factor
  channels: 3
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  val_transform: [ToTensor, Normalize]   # crops are already 128x128

augmentation:                  # E01 used NO augmentation (augmentation is E02) -> E03 uses none
  enabled: false
  note: >
    Color/hue augmentation (S2-EVAL suggestion 5) is a separate run, not part of E03.

model:
  backbone: mobilenet_v2       # torchvision.models.mobilenet_v2
  pretrained_weights: IMAGENET1K_V1
  width_mult: 1.0
  replace_classifier: true     # classifier = Sequential(Dropout(p), Linear(1280, 22))
  head:
    dropout: 0.2               # tuned later in step B (<= 6 runs)
    in_features: 1280

training:
  device: cuda
  batch_size: TODO             # same as E01
  loss: cross_entropy          # nn.CrossEntropyLoss(weight=class_weights), raw logits
  class_weights:
    mode: balanced             # n_total / (n_classes * n_class); max ~27 (trash_cup, 14 samples)
    note: same as E01; sqrt/cap-at-10 weights (S2-EVAL suggestion 3) are a separate run
  optimizer: TODO              # same family as E01 (adam / adamw / sgd)
  weight_decay: TODO
  mixed_precision: false
  # Selection rule matches E01 for a fair comparison (val_loss, patience 6).
  # Macro F1 is still computed every epoch and is the metric you report.
  # Switching early stopping to Macro F1 (S2-EVAL suggestion 4) is a separate, logged change.
  checkpoint_monitor: val_loss

  phase1:
    name: frozen_backbone
    freeze_backbone: true      # requires_grad = False for model.features
    trainable: [classifier]
    epochs: 15
    learning_rate: 1.0e-3
    early_stopping:
      monitor: val_loss
      mode: min
      patience: 6
      restore_best_weights: true

  phase2:
    name: finetune_last_blocks
    load_from: best_phase1.pt
    freeze_backbone: false
    unfreeze_from_block: 14    # model.features[14:]; features has 19 blocks (0-18)
    keep_batchnorm_eval: true  # reapply after every model.train()
    epochs: 20
    learning_rate:
      features: 1.0e-5
      classifier: 1.0e-4
    new_optimizer: true
    early_stopping:
      monitor: val_loss
      mode: min
      patience: 6
      restore_best_weights: true

evaluation:
  split: val                   # validation only
  metrics: [macro_f1, accuracy, per_class_f1, confusion_matrix, macro_f1_plastic6, weighted_f1]
  plastic6_classes: [trash_bottle, trash_bag, trash_snack_wrapper, trash_tarp, trash_rope, trash_net]
  macro_f1_impl: sklearn.metrics.f1_score(average="macro", labels=all_22_classes, zero_division=0)
  measure_efficiency: true
  efficiency:
    count_params: true
    file_size: state_dict .pt size in MB
    inference_time:
      device: cuda             # also report cpu (robot target)
      batch_size: 1
      warmup_iters: 20
      measure_iters: 100       # torch.cuda.synchronize() before reading the timer

paths:
  output_dir: runs/E03_transfer_mobilenetv2   # Drive: runs/E03_*
  checkpoint_phase1: best_phase1.pt
  checkpoint_phase2: best_phase2.pt           # state_dict only
  log_file: docs/experiment_log.md

logging:
  record_fields: [exp_id, baseline_exp_id, data_version, seed, backbone, image_size, phase1_lr,
                  phase2_lr, unfreeze_from_block, dropout, macro_f1_val, macro_f1_plastic6_val,
                  params, file_size_mb, inference_ms, extra_differences]
