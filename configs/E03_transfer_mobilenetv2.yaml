# configs/experiments/E03_transfer_mobilenetv2.yaml
# Project: Ocean Plastic Waste Classification and Monitoring
# Task: S3-CNN | Owner: Hoàng Bách | Reviewer: Phan Hải Yến
# Branch: exp/s3-cnn-e03-transfer
#
# Fields marked TODO must be copied from the best Sprint 2 model (issue #13)
# so the comparison stays fair: ONLY the model changes (custom CNN -> transfer learning).

exp_id: E03
name: transfer_mobilenetv2
description: >
  MobileNetV2 (ImageNet pretrained), 2-phase training. Compared against the
  best Sprint 2 custom CNN with identical split, seed and augmentation.
baseline_exp_id: TODO          # e.g. E02, best Sprint 2 run from #13
changed_factor: model          # the single factor changed vs baseline

data:
  data_version: TODO           # same version as the Sprint 2 baseline (not the new #16 version; that is E04)
  split_file: TODO             # same split file as the baseline
  num_classes: TODO
  use_test_set: false          # Test set must NOT be used in Sprint 3
  num_workers: 2

seed: TODO                     # same seed as the baseline

input:
  image_size: [224, 224]       # MobileNetV2 default; keep consistent with preprocessing below
  channels: 3
  preprocess: mobilenet_v2     # scales pixels to [-1, 1] (tf.keras.applications.mobilenet_v2.preprocess_input)
  # NOTE: do not also apply rescale=1/255, or inputs are normalized twice.

augmentation:                  # TODO: copy exactly from the Sprint 2 baseline config
  horizontal_flip: TODO
  rotation_range: TODO
  zoom_range: TODO
  brightness_range: TODO

model:
  backbone: MobileNetV2
  pretrained_weights: imagenet
  width_multiplier: 1.0        # alpha
  include_top: false
  pooling: avg                 # GlobalAveragePooling2D
  head:
    dropout: 0.2               # tuned later in step B (S3 tuning, <= 6 runs)
    dense_units: null          # null = single softmax layer directly on pooled features
    activation: softmax

training:
  batch_size: 32               # TODO: match the baseline if possible
  loss: categorical_crossentropy   # use sparse_categorical_crossentropy if labels are integers
  optimizer: adam
  metric_for_selection: macro_f1_val
  class_weights: TODO          # same handling as the baseline (none / balanced)

  # Phase 1: frozen backbone, train the head only
  phase1:
    name: frozen_backbone
    freeze_backbone: true
    epochs: 15
    learning_rate: 1.0e-3
    early_stopping:
      monitor: val_macro_f1
      mode: max
      patience: 4
      restore_best_weights: true

  # Phase 2: unfreeze last layers with a small learning rate
  phase2:
    name: finetune_last_layers
    freeze_backbone: false
    unfreeze_last_n_layers: 30   # MobileNetV2 has ~154 layers; adjust after reviewing phase 1 curves
    keep_batchnorm_frozen: true  # BatchNorm layers stay in inference mode for stable fine-tuning
    epochs: 20
    learning_rate: 1.0e-5        # recompile the model after unfreezing
    early_stopping:
      monitor: val_macro_f1
      mode: max
      patience: 5
      restore_best_weights: true

evaluation:
  split: val                   # validation only
  metrics: [macro_f1, accuracy, per_class_f1, confusion_matrix]
  measure_efficiency: true     # params, file size (MB), inference time (ms/img)

paths:
  output_dir: runs/E03_transfer_mobilenetv2   # Drive: runs/E03_*
  checkpoint_phase1: best_phase1.keras
  checkpoint_phase2: best_phase2.keras
  log_file: docs/experiment_log.md            # every run must be recorded here

logging:
  record_fields: [exp_id, data_version, seed, backbone, image_size, phase1_lr, phase2_lr,
                  unfrozen_layers, dropout, macro_f1_val, params, file_size_mb, inference_ms]
