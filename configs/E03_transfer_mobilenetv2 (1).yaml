# configs/experiments/E03_transfer_mobilenetv2.yaml
# Project: Ocean Plastic Waste Classification and Monitoring
# Task: S3-CNN | Owner: Hoàng Bách | Reviewer: Phan Hải Yến
# Branch: exp/s3-cnn-e03-transfer | Framework: PyTorch (torchvision)
#
# Fields marked TODO must be copied from the best Sprint 2 model (issue #13)
# so the comparison stays fair: ONLY the model changes (custom CNN -> transfer learning).

exp_id: E03
name: transfer_mobilenetv2
description: >
  torchvision MobileNetV2 (ImageNet pretrained), 2-phase training. Compared
  against the best Sprint 2 custom CNN with identical split, seed and augmentation.
baseline_exp_id: TODO          # e.g. E02, best Sprint 2 run from #13
changed_factor: model          # the single factor changed vs baseline

data:
  data_version: TODO           # same version as the Sprint 2 baseline (the new #16 version is for E04)
  split_file: TODO             # same split file as the baseline
  num_classes: TODO
  use_test_set: false          # Test set must NOT be used in Sprint 3
  num_workers: 2

seed: TODO                     # same seed as the baseline
reproducibility:
  torch_manual_seed: true
  cudnn_deterministic: true
  cudnn_benchmark: false
  worker_seed_fn: true         # seed DataLoader workers + generator

input:
  image_size: [224, 224]
  channels: 3
  # torchvision backbones expect ImageNet mean/std on [0,1] tensors (NOT [-1,1] like Keras).
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  val_transform: [Resize_224x224, ToTensor, Normalize]   # no random augmentation on val

augmentation:                  # TODO: copy exactly from the Sprint 2 baseline config (train only)
  random_horizontal_flip: TODO
  random_rotation_deg: TODO
  random_resized_crop_scale: TODO
  color_jitter: TODO

model:
  backbone: mobilenet_v2       # torchvision.models.mobilenet_v2
  pretrained_weights: IMAGENET1K_V1
  width_mult: 1.0
  replace_classifier: true     # classifier = Sequential(Dropout(p), Linear(1280, num_classes))
  head:
    dropout: 0.2               # tuned later in step B (<= 6 runs)
    in_features: 1280

training:
  device: cuda
  batch_size: 32               # TODO: match the baseline if possible
  loss: cross_entropy          # nn.CrossEntropyLoss, raw logits (no softmax in the model)
  class_weights: TODO          # same handling as the baseline (none / balanced)
  optimizer: adamw             # TODO: use the same family as the baseline if it used Adam/SGD
  weight_decay: 1.0e-4
  metric_for_selection: macro_f1_val
  mixed_precision: false       # keep false for fair comparison unless baseline used AMP

  # Phase 1: frozen backbone, train the head only
  phase1:
    name: frozen_backbone
    freeze_backbone: true      # requires_grad = False for model.features
    trainable: [classifier]
    epochs: 15
    learning_rate: 1.0e-3
    early_stopping:
      monitor: val_macro_f1
      mode: max
      patience: 4
      restore_best_weights: true

  # Phase 2: unfreeze last blocks with a small learning rate
  phase2:
    name: finetune_last_blocks
    load_from: best_phase1.pt
    freeze_backbone: false
    unfreeze_from_block: 14    # model.features[14:] (blocks 14-18); features has 19 blocks (0-18)
    keep_batchnorm_eval: true  # BN layers stay in eval() so running stats do not drift
    epochs: 20
    learning_rate:
      features: 1.0e-5         # unfrozen backbone blocks
      classifier: 1.0e-4       # head
    new_optimizer: true        # create a fresh optimizer with the param groups above
    early_stopping:
      monitor: val_macro_f1
      mode: max
      patience: 5
      restore_best_weights: true

evaluation:
  split: val                   # validation only
  metrics: [macro_f1, accuracy, per_class_f1, confusion_matrix]
  macro_f1_impl: sklearn.metrics.f1_score(average="macro")
  measure_efficiency: true
  efficiency:
    count_params: true         # total and trainable
    file_size: state_dict .pt size in MB
    inference_time:
      device: cuda             # also report cpu if possible (robot target)
      batch_size: 1
      warmup_iters: 20
      measure_iters: 100       # call torch.cuda.synchronize() before reading the timer

paths:
  output_dir: runs/E03_transfer_mobilenetv2   # Drive: runs/E03_*
  checkpoint_phase1: best_phase1.pt
  checkpoint_phase2: best_phase2.pt           # save state_dict, not the full model
  log_file: docs/experiment_log.md            # every run must be recorded here

logging:
  record_fields: [exp_id, data_version, seed, backbone, image_size, phase1_lr, phase2_lr,
                  unfreeze_from_block, dropout, macro_f1_val, params, file_size_mb, inference_ms]
