# E03G: extended training budget and early-stopping patience; other E03 settings unchanged.
exp_id: E03G
name: transfer_mobilenetv2_extended_training
description: MobileNetV2 transfer learning with longer phase budgets and greater early-stopping
  patience. All other E03 settings remain unchanged for a controlled training-duration
  experiment.
baseline_exp_id: E01
changed_factor: training_budget
known_extra_differences:
- framework TensorFlow/Keras -> PyTorch
- input normalization required by the backbone (ImageNet mean/std instead of Rescaling
  1/255)
- head: E01 GAP->Dropout->Dense(128)->Dropout->softmax; E03 Dropout->Linear(1280,22)
baseline_reference:
  macro_f1_val: 0.076
  accuracy_val: 0.219
  macro_f1_plastic6_val: 0.0
  best_val_loss: 2.977
  random_chance_macro_f1: 0.045
data:
  data_version: v1_crop128
  processed_dir: /content/processed/v1_crop128
  processed_zip: /content/drive/MyDrive/ocean-plastic-ml/data/processed/v1_crop128.zip
  split_manifest: split_manifest.csv
  class_mapping_path: class_mapping.json
  split_info:
    strategy: grouped_by_video
    video_id_regex: vid_(\d+)
    ratios:
      train: 0.7
      val: 0.15
      test: 0.15
    seed: 42
  num_classes: 22
  class_names:
  - rov
  - plant
  - animal_fish
  - animal_starfish
  - animal_shells
  - animal_crab
  - animal_eel
  - animal_etc
  - trash_clothing
  - trash_pipe
  - trash_bottle
  - trash_bag
  - trash_snack_wrapper
  - trash_can
  - trash_cup
  - trash_container
  - trash_unknown_instance
  - trash_branch
  - trash_wreckage
  - trash_tarp
  - trash_rope
  - trash_net
  plastic6_indices:
  - 10
  - 11
  - 12
  - 19
  - 20
  - 21
  train_samples: 8283
  val_samples: 1782
  use_test_set: false
  num_workers: 2
seed: 42
reproducibility:
  torch_manual_seed: true
  cudnn_deterministic: true
  cudnn_benchmark: false
  worker_seed_fn: true
input:
  image_size:
  - 128
  - 128
  channels: 3
  normalize:
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
  val_transform:
  - ToTensor
  - Normalize
augmentation:
  enabled: false
  note: 'Color/hue augmentation (S2-EVAL suggestion 5) is a separate run, not part
    of E03.

    '
model:
  backbone: mobilenet_v2
  pretrained_weights: IMAGENET1K_V1
  width_mult: 1.0
  replace_classifier: true
  head:
    dropout: 0.4
    in_features: 1280
training:
  device: cuda
  batch_size: 64
  loss: cross_entropy
  loss_weighting: per_sample
  class_weights:
    mode: balanced
    max_weight: 50.0
    note: same as E01; sqrt/cap-at-10 weights (S2-EVAL suggestion 3) are a separate
      run
  optimizer: adam
  adam_eps: 1.0e-07
  weight_decay: 0.0
  mixed_precision: false
  lr_scheduler:
    name: reduce_on_plateau
    monitor: val_loss
    patience: 3
    factor: 0.5
    min_lr: 1.0e-05
  checkpoint_monitor: val_loss
  phase1:
    name: frozen_backbone
    freeze_backbone: true
    trainable:
    - classifier
    epochs: 30
    learning_rate: 0.001
    early_stopping:
      monitor: val_loss
      mode: min
      patience: 12
      restore_best_weights: true
  phase2:
    name: finetune_last_blocks
    load_from: best_phase1.pt
    freeze_backbone: false
    unfreeze_from_block: 14
    keep_batchnorm_eval: true
    epochs: 40
    learning_rate:
      features: 1.0e-05
      classifier: 0.0001
    new_optimizer: true
    min_lr:
    - 1.0e-06
    - 1.0e-05
    early_stopping:
      monitor: val_loss
      mode: min
      patience: 12
      restore_best_weights: true
evaluation:
  split: val
  metrics:
  - macro_f1
  - accuracy
  - per_class_f1
  - confusion_matrix
  - macro_f1_plastic6
  - weighted_f1
  plastic6_classes:
  - trash_bottle
  - trash_bag
  - trash_snack_wrapper
  - trash_tarp
  - trash_rope
  - trash_net
  macro_f1_impl: sklearn.metrics.f1_score(average="macro", labels=all_22_classes,
    zero_division=0)
  measure_efficiency: true
  efficiency:
    count_params: true
    file_size: state_dict .pt size in MB
    inference_time:
      device: cuda
      batch_size: 1
      warmup_iters: 20
      measure_iters: 100
paths:
  output_dir: runs/E03G_transfer_mobilenetv2_extended_training
  checkpoint_phase1: best_phase1.pt
  checkpoint_phase2: best_phase2.pt
  log_file: docs/experiment_log.md
logging:
  record_fields:
  - exp_id
  - baseline_exp_id
  - data_version
  - seed
  - backbone
  - image_size
  - phase1_lr
  - phase2_lr
  - unfreeze_from_block
  - dropout
  - macro_f1_val
  - macro_f1_plastic6_val
  - params
  - file_size_mb
  - inference_ms
  - extra_differences
